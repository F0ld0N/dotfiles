# 1. Блокируем экран
listener {
    timeout = 300                                # 5 минут
    on-timeout = loginctl lock-session           # блокировка
}

# 2. Выключаем монитор
listener {
    timeout = 330                                # 5.5 минут
    on-timeout = hyprctl dispatch dpms off       # выключить экран
    on-resume = hyprctl dispatch dpms on         # включить при активности
}
